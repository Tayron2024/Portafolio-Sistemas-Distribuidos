services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ape5-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ape5-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
